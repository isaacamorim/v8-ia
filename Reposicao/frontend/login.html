<!-- frontend/login.html -->
<!DOCTYPE html>
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>

<body>
    <h2>Informe sua senha</h2>
    <form id="formLogin">
        <input type="password" id="inpLogin" placeholder="Senha" required>
        <button>Entrar</button>
    </form>
    <p id="msgLogin"></p>
    <script>
        document.getElementById("formLogin").addEventListener("submit", async e => {
            e.preventDefault();
            const cnpj = sessionStorage.getItem("cnpj");
            const senha = document.getElementById("inpLogin").value;
            const msg = document.getElementById("msgLogin");
            try {
                const res = await fetch("/api/cnpj/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ documento: cnpj, senha })
                });
                const j = await res.json();
                if (j.success) {
                    sessionStorage.setItem("usuario_nome", j.usuario.nome);
                    window.location.href = "index.html";
                } else {
                    msg.textContent = j.error || "Credenciais inválidas";
                }
            } catch (e) {
                msg.textContent = "Falha de rede";
            }
        });
    </script>
</body>

</html>
