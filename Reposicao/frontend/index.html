<!--frontend/index.html-->
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reposição de Peças - Novo Horizonte</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="css/main.css" rel="stylesheet" />
</head>

<body>

    <!-- Overlay de verificação/login -->
    <section class="verify-overlay" id="verifyOverlay">
        <!-- dentro da <section id="verifyOverlay"> -->
        <div class="verify-box" id="boxVerificacao">
            <h2>Verificação de Acesso</h2>
            <form id="verificacaoRapida">
                <input type="text" id="docQuick" placeholder="Digite seu CNPJ/CPF" required />
                <button type="submit">Verificar</button>
            </form>
        </div>
        
        <div class="verify-box" id="boxSenha" style="display:none;">
            <h2 id="senhaTitle">Criar Senha</h2>
            <p id="senhaDescricao">Defina sua senha para continuar</p>
            <form id="formSenha">
                <!-- Campo único: login ou criação -->
                <input type="password" id="novaSenha" placeholder="Digite sua senha">
            
                <!-- Só aparece se for criação de senha -->
                <div id="grupoConfirmar" style="display: none;">
                    <input type="password" id="confirmarSenha" placeholder="Confirme sua senha">
                </div>
            
                <button type="submit">Continuar</button>
            </form>

            <button type="button" onclick="voltarParaVerificacao()">Voltar</button>
        </div>
    </section>

    <!-- Cabeçalho -->
    <header id="appHeader" style="display:none;">
        <div class="client-status" id="clientStatus">
            <span id="clientStatusText"></span>
        </div>
        <div class="cart-icon" id="cartIcon">
            <i class="fas fa-shopping-cart"></i>
            <span id="cartCount">0</span>
        </div>
    </header>

    <!-- Conteúdo principal -->
    <main class="main-container" id="conteudoPrincipal" style="display: none;">
        <section class="filters-header">
            <div id="searchToggleArea">
                <button id="btnBuscar"><i class="fas fa-search"></i> Buscar</button>
            </div>
            <button id="btnFiltrar"><i class="fas fa-sliders-h"></i> Filtros</button>
        </section>

        <div id="searchBarContainer" style="display: none; width: 100%;">
            <div class="search-bar">
                <input type="text" id="searchInput" class="search-input"
                    placeholder="Buscar por código, descrição ou palavras-chave...">
                <button id="btnCloseSearch" class="close-search">&times;</button>
            </div>
        </div>
    </main>

    <section class="products-section" id="productsGrid">
        <div class="loading"><i class="fas fa-spinner fa-pulse"></i> Carregando produtos...</div>
    </section>

    <aside class="cart-sidebar">
        <h3>Carrinho</h3>
        <div class="cart-items" id="cartItems"></div>
        <button class="finalize-order">Enviar Pedido</button>
    </aside>

    <aside class="filter-sidebar" id="filterSidebar">
        <h3>Filtrar por Palavras-chave</h3>
        <div class="filter-options" id="filterOptions"></div>
        <button class="apply-filter" id="applyFilterBtn">Aplicar Filtros</button>
    </aside>

    <div class="notification" id="notification"></div>

    <!-- Scripts -->
    <script src="js/produtos.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/filtros.js"></script>
    <script src="js/carrinho.js"></script>

<!-- ... HTML anterior mantido ... -->

<script>
    const formVerificacao = document.getElementById("verificacaoRapida");
    const docQuick = document.getElementById("docQuick");

    const senhaBox = document.getElementById("boxSenha");
    const formSenha = document.getElementById("formSenha");
    const senhaTitle = document.getElementById("senhaTitle");
    const senhaDescricao = document.getElementById("senhaDescricao");
    const boxVerificacao = document.getElementById("boxVerificacao");

    const novaSenhaInput = document.getElementById("novaSenha");
    const confirmarSenhaInput = document.getElementById("confirmarSenha");
    const grupoConfirmar = document.getElementById("grupoConfirmar");

    let cnpjGlobal = "";
    let modo = ""; // "login" ou "criar_senha"

    formVerificacao.addEventListener("submit", async (e) => {
        e.preventDefault();
        const documento = docQuick.value.trim();

        try {
            const res = await fetch(`http://127.0.0.1:5000/api/cnpj/verificar?documento=${encodeURIComponent(documento)}`);
            const data = await res.json();

            if (data.status === "existente_com_senha") {
                // Login
                cnpjGlobal = documento;
                modo = "login";

                senhaBox.style.display = "block";
                boxVerificacao.style.display = "none";

                senhaTitle.textContent = "Login";
                senhaDescricao.textContent = `Olá ${data.nome || "cliente"}, digite sua senha para continuar.`;
                grupoConfirmar.style.display = "none";

            } else if (data.status === "existente_sem_senha") {
                // Criar senha
                cnpjGlobal = documento;
                modo = "criar_senha";

                senhaBox.style.display = "block";
                boxVerificacao.style.display = "none";

                senhaTitle.textContent = "Criar Senha";
                senhaDescricao.textContent = `Olá ${data.nome || "cliente"}, defina uma senha para continuar.`;
                grupoConfirmar.style.display = "block";

            } else if (data.status === "nao_encontrado") {
                // Não encontrado → WhatsApp
                const confirmZap = confirm("CNPJ não cadastrado. Deseja solicitar cadastro via WhatsApp?");
                if (confirmZap) {
                    const mensagem = `Olá! Gostaria de solicitar meu cadastro para o sistema de peças. Meu CNPJ é ${documento}.`;
                    const link = `https://wa.me/551934512822?text=${encodeURIComponent(mensagem)}`;
                    window.open(link, "_blank");
                }
            } else {
                alert(data.mensagem || "Erro ao verificar.");
            }

        } catch (err) {
            console.error(err);
            alert("Erro ao conectar com o servidor.");
        }
    });

    formSenha.addEventListener("submit", async (e) => {
        e.preventDefault();

        const novaSenha = novaSenhaInput.value.trim();
        const confirmarSenha = confirmarSenhaInput.value.trim();

        if (!novaSenha) {
            alert("Informe sua senha.");
            return;
        }

        if (modo === "criar_senha" && novaSenha !== confirmarSenha) {
            alert("As senhas não coincidem.");
            return;
        }

        const rota = (modo === "login") ? "login" : "definir-senha";

        try {
            const res = await fetch(`http://127.0.0.1:5000/api/cnpj/${rota}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ documento: cnpjGlobal, senha: novaSenha }),
            });

            const data = await res.json();

            if (res.ok && data.success) {
                alert("Acesso liberado!");
                carregarProdutos();

                document.getElementById("verifyOverlay").style.display = "none";
                document.getElementById("appHeader").style.display = "flex";
                document.getElementById("conteudoPrincipal").style.display = "block";

                document.getElementById("clientStatusText").textContent = `${data.usuario.nome} (${data.usuario.cnpj})`;
            } else {
                alert(data.error || "Erro ao autenticar.");
            }

        } catch (err) {
            alert("Erro de conexão.");
            console.error(err);
        }
    });

    function voltarParaVerificacao() {
        senhaBox.style.display = "none";
        boxVerificacao.style.display = "block";
        novaSenhaInput.value = "";
        confirmarSenhaInput.value = "";
    }
</script>

</body>
</html>
