<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reposição de Peças - Novo Horizonte</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/main.css" rel="stylesheet">
    <script type="module" src="js/cnpj_verification.js"></script>
    <script type="module" src="js/produtos.js"></script>
</head>

<body>
    <!-- Tela de Verificação/Login -->
    <section class="verify-overlay" id="verifyOverlay">
        <div class="verify-box">
            <h2>Verificação de Acesso</h2>
            <form id="verificacaoRapida">
                <input type="text" id="docQuick" placeholder="Digite seu CNPJ/CPF" required>
                <button type="submit">Verificar</button>
            </form>
        </div>
    </section>

    <!-- Conteúdo principal (oculto até login) -->
    <header id="appHeader" style="display:none;">
        <div class="client-status" id="clientStatus">
            <span id="clientStatusText"></span>
        </div>
    </header>

    <main class="main-container" id="conteudoPrincipal" style="display:none;">
        <!-- Filtros e busca -->
        <section class="filters">
            <h3><i class="fas fa-filter"></i> Filtros</h3>
            <input type="text" class="search-input" id="searchInput" placeholder="Buscar por código ou descrição...">
            <div class="category-filters" id="categoryFilters">
                <div class="filter-tag active" data-category="todos">Todos</div>
                <div class="filter-tag" data-category="rolamento">Rolamentos</div>
                <div class="filter-tag" data-category="empacotadeira">Empacotadeira</div>
                <div class="filter-tag" data-category="eva">EVA</div>
                <div class="filter-tag" data-category="sobe e desce">Sobe e Desce</div>
            </div>
        </section>

        <!-- Grid de Produtos -->
        <section class="products-section" id="productsGrid">
            <div class="loading"><i class="fas fa-spinner fa-pulse"></i> Carregando produtos...</div>
        </section>

        <!-- Sidebar do Carrinho -->
        <aside class="cart-sidebar">
            <h3><i class="fas fa-shopping-cart"></i> Carrinho</h3>
            <div class="cart-items" id="cartItems">
                <div class="empty-cart"><i class="fas fa-shopping-cart"></i>
                    <p>Seu carrinho está vazio</p>
                </div>
            </div>
            <div class="cart-total" id="cartTotal" style="display:none;">
                <div>Total de itens: <span id="cartTotalValue">0</span></div>
            </div>
            <button class="finalize-order" id="finalizeOrder" disabled>Finalizar Pedido</button>
        </aside>
    </main>

    <!-- Notificação -->
    <div class="notification" id="notification"></div>

    <!-- Scripts -->
    <script src="js/cnpj_verification.js"></script>
    <script src="js/produtos.js"></script>
    <script src="js/cart.js"></script>
</body>

</html>
