<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Confirmado</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="images/logo.png" alt="Logo">
        </div>
    </header>

    <main class="confirmation">
        <div class="confirmation-card">
            <img src="images/success-icon.png" alt="Sucesso">
            <h1>Pedido Enviado com Sucesso!</h1>
            <p>Seu pedido de reposição foi enviado para nossa equipe.</p>
            <p>Entraremos em contato em breve para confirmar os detalhes.</p>
            <div class="whatsapp-info">
                <img src="images/whatsapp-icon.png" alt="WhatsApp">
                <p>Dúvidas? Chame no WhatsApp: (19) 99999-9999</p>
            </div>
            <a href="index.html" class="btn">Voltar à Página Inicial</a>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>

</html>
